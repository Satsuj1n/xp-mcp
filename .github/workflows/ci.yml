name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test MCP server
        run: |
          OUTPUT=$(node dist/index.js <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          EOF
          )
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q '"name":"get_positions"' || (echo "Smoke test failed — get_positions not registered" && exit 1)
          echo "$OUTPUT" | grep -q '"name":"import_xperformance_pdf"' || (echo "Smoke test failed — import_xperformance_pdf not registered" && exit 1)
          echo "All 3 tools registered correctly"
