name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test MCP server
        run: |
          OUTPUT=$(node dist/index.js <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          EOF
          )
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q '"name":"get_positions"'             || { echo "Smoke failed: get_positions not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"import_xperformance_pdf"'   || { echo "Smoke failed: import_xperformance_pdf not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"import_extract_csv"'        || { echo "Smoke failed: import_extract_csv not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"calculate_allocation_drift"' || { echo "Smoke failed: calculate_allocation_drift not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"set_advisor_profile"'       || { echo "Smoke failed: set_advisor_profile not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"get_advisor_profile"'       || { echo "Smoke failed: get_advisor_profile not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"get_market_data"'           || { echo "Smoke failed: get_market_data not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"screen_assets"'             || { echo "Smoke failed: screen_assets not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"get_portfolio_summary"'     || { echo "Smoke failed: get_portfolio_summary not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"import_bank_extract_pdf"'   || { echo "Smoke failed: import_bank_extract_pdf not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"get_cash_flows"'            || { echo "Smoke failed: get_cash_flows not registered"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"suggest_buys"'              || { echo "Smoke failed: suggest_buys not registered"; exit 1; }
          echo "All 12 tools registered correctly"
