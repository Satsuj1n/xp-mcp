name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test MCP server
        run: |
          OUTPUT=$(node dist/index.js <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"release-ci","version":"0.0.0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          EOF
          )
          echo "$OUTPUT" | grep -q '"name":"get_positions"'              || { echo "Smoke failed: get_positions not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"import_xperformance_pdf"'    || { echo "Smoke failed: import_xperformance_pdf not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"import_extract_csv"'         || { echo "Smoke failed: import_extract_csv not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"calculate_allocation_drift"' || { echo "Smoke failed: calculate_allocation_drift not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"set_advisor_profile"'        || { echo "Smoke failed: set_advisor_profile not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"get_advisor_profile"'        || { echo "Smoke failed: get_advisor_profile not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"get_market_data"'            || { echo "Smoke failed: get_market_data not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"screen_assets"'              || { echo "Smoke failed: screen_assets not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"get_portfolio_summary"'     || { echo "Smoke failed: get_portfolio_summary not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"import_bank_extract_pdf"'   || { echo "Smoke failed: import_bank_extract_pdf not in tools/list"; exit 1; }
          echo "$OUTPUT" | grep -q '"name":"get_cash_flows"'            || { echo "Smoke failed: get_cash_flows not in tools/list"; exit 1; }

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
